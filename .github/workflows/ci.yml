# ═══════════════════════════════════════════════════════════════════
# Stairs — CI
#
# The repository had no workflows. Fifteen pull requests merged on
# 2026-08-09 and not one of them ran a test, on either side of the stack.
# That is not a hypothetical: #72 shipped a ReferenceError that threw on
# every click of a header control, under a suite that was green on a laptop
# and never executed anywhere else.
#
# ONE THING PER JOB, so a red X says which thing broke without opening the
# log. They are deliberately dull. A workflow nobody trusts gets ignored, and
# the way a workflow loses trust is by being clever, or by being red for a
# reason nobody intends to fix.
#
#   lint       no-undef and three other correctness rules — nothing stylistic
#   frontend   vitest, then the build
#   backend    pytest
#   contrast   the token audit, both themes
#   affordance elements whose look and behaviour disagree
#   render     what a browser actually draws, asserted as numbers
#
# THE CONTRAST GATE COVERS BOTH THEMES. It did not always. Dark shipped at
# 22/29 while light passed, so the dark job was held back rather than opening
# this file red on its first run — the same trust argument as above, applied to
# its own gate. Those pairs are fixed and both themes now assert, which is what
# makes the matrix honest rather than decorative.
#
# THE RENDER JOB ASSERTS MEASUREMENTS, NOT PIXELS. Everything the other four
# jobs can see is source, tokens or jsdom, and a focus ring passed all of them
# while rendering invisible on 13 of 49 controls — an ancestor clipped it. So
# one job runs a real browser. It compares no images: a pixel diff fails on a
# font hint or a driver, and a job that cries wolf is switched off inside a
# week, which costs more than it ever caught. It reads geometry, composited
# colour and contrast ratios, which are the same numbers on every run — proved
# by running it three times and diffing.
#
# THE LINT JOB IS NARROW ON PURPOSE. It exists because #72's ReferenceError was
# statically detectable: no-undef finds a call to a deleted setter in about a
# second, with no test, no browser and no render. Correctness rules only. A
# never-linted codebase opening red with hundreds of style findings would be
# ignored exactly the way a red contrast gate would have been, so style is out
# and stays out.
# ═══════════════════════════════════════════════════════════════════

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push supersedes the first; don't pay for the run it replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails on errors only. no-unused-vars and exhaustive-deps are warnings and
  # do not block a merge — they are worth seeing, not worth stopping for, and a
  # job that blocks on either would be the style gate this is not.
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # The build is part of the gate because a type-free codebase has no
      # other check that every import still resolves.
      - run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # No database. tests/conftest.py mocks the asyncpg pool, which is what
      # keeps this job a plain install-and-run with no service container.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  # Both themes now. Dark was held out while it sat at 22/29 — gating it then
  # would have opened this workflow red on its first run. It passes 30/30, so
  # the gate closes.
  #
  # The matrix interpolates into `name`, which keeps the light check called
  # exactly `contrast-light` — the string branch protection already requires.
  # Renaming it would leave that rule waiting on a check that never reports,
  # and main unmergeable with nothing in the UI saying why. `contrast-dark` is
  # a new check and has to be added to the required list to gate rather than
  # merely report.
  contrast:
    name: contrast-${{ matrix.theme }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free by design, so it needs no install step: the audit
      # reads the token values it asserts on and composites them itself.
      - run: node scripts/contrast-audit.mjs ${{ matrix.theme }}

  # Elements that look like controls and aren't, controls that don't look like
  # controls, and clicks no keyboard can reach. It gates six of its eight
  # categories: status badges are pills by design and cards are allowed a box,
  # so gating those would make this the job nobody reads — the same trust
  # argument the contrast gate is built on.
  #
  # Unlike the contrast audit this one needs an install: it parses every view's
  # JSX with @babel/parser rather than reading a table of values.
  affordance:
    name: affordance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/affordance-audit.mjs --gate

  # A real browser, asserting numbers. Playwright lives HERE and nowhere else:
  # its postinstall downloads browsers, so making it a devDependency would slow
  # the `npm ci` in all four other jobs. --no-save keeps the lockfile clean.
  render:
    name: render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Pinned, so the browser build is fixed rather than whatever is newest.
      - run: npm i --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/render-gate.mjs --list

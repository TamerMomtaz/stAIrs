# ═══════════════════════════════════════════════════════════════════
# Stairs — CI
#
# The repository had no workflows. Fifteen pull requests merged on
# 2026-08-09 and not one of them ran a test, on either side of the stack.
# That is not a hypothetical: #72 shipped a ReferenceError that threw on
# every click of a header control, under a suite that was green on a laptop
# and never executed anywhere else.
#
# ONE THING PER JOB, so a red X says which thing broke without opening the
# log. They are deliberately dull. A workflow nobody trusts gets ignored, and
# the way a workflow loses trust is by being clever, or by being red for a
# reason nobody intends to fix.
#
#   lint       no-undef and three other correctness rules — nothing stylistic
#   frontend   vitest, then the build
#   backend    pytest
#   contrast   the token audit, both themes
#   controls   the same maths against what the components actually paint
#
# THE CONTRAST GATE COVERS BOTH THEMES. It did not always. Dark shipped at
# 22/29 while light passed, so the dark job was held back rather than opening
# this file red on its first run — the same trust argument as above, applied to
# its own gate. Those pairs are fixed and both themes now assert, which is what
# makes the matrix honest rather than decorative.
#
# THE LINT JOB IS NARROW ON PURPOSE. It exists because #72's ReferenceError was
# statically detectable: no-undef finds a call to a deleted setter in about a
# second, with no test, no browser and no render. Correctness rules only. A
# never-linted codebase opening red with hundreds of style findings would be
# ignored exactly the way a red contrast gate would have been, so style is out
# and stays out.
# ═══════════════════════════════════════════════════════════════════

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push supersedes the first; don't pay for the run it replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails on errors only. no-unused-vars and exhaustive-deps are warnings and
  # do not block a merge — they are worth seeing, not worth stopping for, and a
  # job that blocks on either would be the style gate this is not.
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # The build is part of the gate because a type-free codebase has no
      # other check that every import still resolves.
      - run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # No database. tests/conftest.py mocks the asyncpg pool, which is what
      # keeps this job a plain install-and-run with no service container.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  # Both themes now. Dark was held out while it sat at 22/29 — gating it then
  # would have opened this workflow red on its first run. Both themes pass, so
  # the gate closes. (No count here on purpose: rows get added as roles are
  # measured, and a number in a comment is a number that goes stale.)
  #
  # The matrix interpolates into `name`, which keeps the light check called
  # exactly `contrast-light` — the string branch protection already requires.
  # Renaming it would leave that rule waiting on a check that never reports,
  # and main unmergeable with nothing in the UI saying why. `contrast-dark` is
  # a new check and has to be added to the required list to gate rather than
  # merely report.
  contrast:
    name: contrast-${{ matrix.theme }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free by design, so it needs no install step: the audit
      # reads the token values it asserts on and composites them itself.
      - run: node scripts/contrast-audit.mjs ${{ matrix.theme }}

  # The contrast jobs above check the PALETTE — a hand-written list of role
  # pairs. That list passed for months while the app's primary call-to-action
  # printed near-white on gold at 2.78:1, because the pair it asserts is
  # --ink-on-accent on gold and the pair the buttons painted was --surface-app
  # on gold. Nothing was wrong with the audit; it was measuring a different
  # application than the one being shipped.
  #
  # This job closes that gap by measuring no list at all. It reads tokens.css,
  # constants.js and every .jsx, and holds the (fill, ink) pairs the components
  # ACTUALLY paint against 4.5:1 in both themes. It cannot drift from the
  # components, because it is derived from them.
  #
  # `controls` is a new check. Like contrast-dark before it, it reports before
  # it gates: it has to be added to the required list in branch protection to
  # block a merge rather than merely show up.
  controls:
    name: controls
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free for the same reason as the audit above: it parses the
      # sources it checks rather than importing them.
      - run: npm run audit:controls

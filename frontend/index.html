<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/stairs.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stairs — Climb Your Strategy</title>

    <!-- Start the two first-paint faces downloading with the first bytes of the
         document, rather than waiting for the CSS to be fetched and parsed.
         This is what closes the swap window to nothing on a warm connection. -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Theme, before first paint. This runs synchronously in <head> on
      // purpose: setting data-theme from React would let the browser paint
      // one frame of the wrong theme first, and a white flash on a returning
      // dark-mode session is worse than the millisecond this costs.
      //
      // Light is the default. Dark is no longer the only thing this app can
      // render — it is a remembered choice.
      try {
        var t = localStorage.getItem("stairs_theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <script>
      // The Arabic face is 124 KB and most sessions never render an Arabic
      // glyph, so it is not preloaded unconditionally — unicode-range already
      // keeps it off the wire. For a session that has chosen Arabic, preload it
      // too, and set the document language so font selection, hyphenation and
      // screen readers all agree with what is about to render.
      try {
        if (localStorage.getItem("stairs_lang") === "ar") {
          document.documentElement.lang = "ar";
          var l = document.createElement("link");
          l.rel = "preload";
          l.href = "/fonts/noto-kufi-arabic.woff2";
          l.as = "font";
          l.type = "font/woff2";
          l.crossOrigin = "anonymous";
          document.head.appendChild(l);
        }
      } catch (e) {}
    </script>

    <style>
      /* Same stack the app uses, so the pre-mount paint is already in the right
         typeface instead of switching once React takes over. */
      body {
        font-family: "DM Sans", "DM Sans Fallback", system-ui, -apple-system, sans-serif;
      }

      /* The pre-mount ground, and the only place in the app where a palette
         value is written twice. It has to be: tokens.css arrives with the JS
         bundle, so between first paint and mount there are no custom
         properties to read — and the previous hardcoded #020617 meant a light
         session opened on a near-black flash, which is exactly what the
         theme boot script above exists to prevent. It was also wrong for dark:
         #020617 is not the app's #0a1628.

         These two lines must track --surface-app and --ink in tokens.css. */
      html[data-theme="light"] body { background: #faf8f4; color: #0f1b33; color-scheme: light }
      html[data-theme="dark"] body { background: #0a1628; color: #ffffff; color-scheme: dark }
      html[lang="ar"] body {
        font-family: "Noto Kufi Arabic", "DM Sans", "DM Sans Fallback", system-ui, sans-serif;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
